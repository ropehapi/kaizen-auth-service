version: '3'

services:
  db:
    image: mysql:5.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auth-service
      MYSQL_PASSWORD: root
    ports:
      - ${DB_PORT}:3306
    volumes:
      - .docker/mysql:/var/lib/mysql
      - "./scripts/schema.sql:/docker-entrypoint-initdb.d/1.sql"

